name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              ./install.sh)
                /bin/sh -n "$file"
                ;;
              *)
                /bin/bash -n "$file"
                ;;
            esac
          done < <(find . -type f -name '*.sh' -print0)

      - name: Check generated Remnawave panel payload
        shell: bash
        run: |
          set -euo pipefail
          cat crowdsec-remnawave-panel/part-*.sh.inc > /tmp/remnawave-panel.sh
          /bin/bash -n /tmp/remnawave-panel.sh

      - name: Compile Python files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q .

      - name: ShellCheck critical errors
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=error
